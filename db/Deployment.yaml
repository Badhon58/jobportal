apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  templete:
    metadata:
      app: mongo
  spec:
    containers:
      - name: mongo
        image: mongo:7
        args: ["--dbpath", "/data/db"]
        env:
          - name: MONGO_INITDB_ROOT_USERNAME
            value: "admin"
          - name: MONGO_INITDB_ROOT_PASSWORD
            value: "password"
        volumeMounts:
          - mountPath: "/data/db"
            name: mongo-volume
    volumes:
      - name: mongo-volume
        persistentVolumeClaim:
          claimName: mongo-pvc
